<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Meme Generator RF</title>
		<link rel="icon" type="image/png" href="assets/mgrf.png">
		<link rel="stylesheet" href="css/main.css">
		<link rel="stylesheet" href="css/crea.css">
		<script src="scripts/canvas.js" type="module"></script>
	</head>
<body>
	<header class="content">
		<p class="logo">
			<a href="index.html"><span>MG</span>RF</a>
		</p>
		<nav>
			<ul>
				<li><a href="#gallery" class="btn">Create Meme</a></li>
			</ul>
		</nav>
	</header>
	<main>
		<section class="meme-editor content">
			<canvas class="editor-canvas"></canvas>
			<div class="controls">
				<div>
					<div class="control-group">
						<label for="text-top">Top text</label>
						<textarea name="text-top" id="text-top" class="text-top" placeholder="Enter top text"></textarea>
					</div>
					<div class="control-group">
						<label for="text-bottom">Bottom text</label>
						<textarea name="text-bottom" id="text-bottom" class="text-bottom" placeholder="Enter bottom text"></textarea>
					</div>
					<div class="control-group">
						<label for="text-size">Text size</label>
						<input type="range" name="text-size" id="text-size" min="0" max="100" value="20" class="text-size">
					</div>
					<button class="btn btn--small save-button">Download Meme</button>
				</div>
			</div>
		</section>
		<section>
			<ul class="recent-memes" id="gallery"></ul>
		</section>
	</main>
        <footer style="margin-top: 20px; text-align: center; color: #333435; font-size: 0.9rem;">
            made by <a href="https://github.com/StrikeAspect" target="_blank" rel="noopener noreferrer" style="color: #2342cc; text-decoration: none;">@RF-Creator</a>
        </footer>
</body>
</html>
